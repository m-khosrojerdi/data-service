stages:
  - build
  - deploy
variables:
  GIT_STRATEGY: clone
  TAG_LATEST: nexus.mapnamind.com/data-service:latest
  TAG_TEST: nexus.mapnamind.com/data-service:test
  TAG_COMMIT: nexus.mapnamind.com/data-service:$CI_COMMIT_SHORT_SHA
build:
  stage: build
  tags:
    - NMB
  script:
    - chmod 775 script.sh
    - |
      if [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
      ./script.sh prod
      docker build . --add-host=nexus.mapnamind.com:192.168.1.149 -t $TAG_LATEST
      docker image tag $TAG_LATEST $TAG_COMMIT
      docker image push $TAG_LATEST
      docker image push $TAG_COMMIT
      docker image rm --force $TAG_LATEST $TAG_COMMIT
      else
      ./script.sh dev
      docker build . --add-host=nexus.mapnamind.com:192.168.1.149 -t $TAG_TEST
      docker image push $TAG_TEST
      docker image rm --force $TAG_TEST
      fi
deploy:
  tags:
    - NMB

  stage: deploy
  script:
    - |
      if [[ "$CI_COMMIT_BRANCH" == "dev" ]]; then
        ssh root@192.168.1.25 " cd /root/compose &&  docker compose down && docker image rm --force nexus.mapnamind.com/data-service:test&&docker compose up -d"
      elif [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
        ssh root@192.168.1.101 "kubectl delete -f MAPNAMIND/data-service.yml"
        bash /home/gitlab-runner/kub.sh $TAG_LATEST
        ssh root@192.168.1.101 "kubectl apply -f MAPNAMIND/data-service.yml"
      fi
