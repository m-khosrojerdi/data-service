stages:
  - build
  - deploy
variables:
  GIT_STRATEGY: clone
  TAG_LATEST: nexus.mapnamind.com/data-service:latest
  TAG_COMMIT: nexus.mapnamind.com/data-service:$CI_COMMIT_SHORT_SHA
build:
 stage: build
 script:
   - ls -l
   - chmod 775 script.sh
   - ./script.sh
   - docker build . --add-host=nexus.mapnamind.com:192.168.1.149 -t $TAG_LATEST
   - docker image tag $TAG_LATEST $TAG_COMMIT
   - docker image push $TAG_LATEST
   - docker image push $TAG_COMMIT
   - docker image rm --force $TAG_LATEST $TAG_COMMIT
deploy:
  stage: deploy
  script:
    - ssh root@192.168.1.101 " kubectl delete -f MAPNAMIND/data-service.yml"
    - bash /home/gitlab-runner/kub.sh $TAG_LATEST
    - ssh root@192.168.1.101 "kubectl apply  -f MAPNAMIND/data-service.yml"

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
